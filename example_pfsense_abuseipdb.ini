; Sample pfsense_abuseipdb.ini file

; Credentials (paths to token/password files, one secret per file)
pfsense_token_file=/root/.credentials/.pfsense-token
abuseipdb_token_file=/root/.credentials/.abuseipdb-token
ipinfo_token_file=/root/.credentials/.ipinfo-token
gmail_app_password_file=/root/.credentials/.gmail-app-password
mysql_password_file=/root/.credentials/.abuseipdb-mysql-password
abuseip_email_password_file=/root/.credentials/.abuse-email-password
xarf_token_file=/root/.credentials/.xarf-report-token

; pfSense API URL (used by the commented-out filterlog section)
pfsense_url=https://192.168.1.1:444

; Suricata
; Path to Suricata eve.json alert log
alerts_file=/var/log/suricata/suricata_XXXXXXXXXX/eve.json

; Path to block log
block_log_file=/var/log/abuseipdb_block.log

; WAN interface
wan=igb0

; AbuseIPDB
; Your AbuseIPDB user id
abuseipdb_user_id=0

; Number of detections in the block log before an IP is reported
report_limit=15

; AbuseIPDB confidence score limit (past 90 days)
abuseipdb_confidense_score_limit=25

; Mysql database
; Local domain used in reports
domain=pfsense.example.com

mysql_host=192.168.1.1
mysql_user=abuseipdb
mysql_database=abuseipdb

; Use Mysql database true/false (yes/no)
use_mysql=yes

; Show ipinfo lookup for each alert true/false (yes/no)
show_ip_info=yes

; Show WHOIS abuse contact email for each alert true/false (yes/no)
show_ip_abusedb_email=yes

; Email settings
; Send abuse report email to WHOIS abuse contact true/false (yes/no)
send_abuse_email_report=no

; Number of detections before an abuse email is sent
email_report_limit=25

report_name=AbuseIP Report
report_email=abuse@example.com
report_smtp_host=mail.example.com
report_smtp_port=465

; X-ARF
; Send X-ARF report to abusix true/false (yes/no)
send_xarf_report=yes

xarf_org=Private
xarf_contact=abuse@example.com
xarf_domain=example.com

; Comma-separated list of pf tables used to whitelist source IPs
suricata_whitelists=Example_Whitelist_Table
